# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# client_id is filled by `shopify app config link` / Partner Dashboard (human).
client_id = ""
name = "jp-delivery-date"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# read_orders + read_products. Do not request read_all_orders.
# metafieldsSet on a product needs the same access as mutating the product.
scopes = "read_orders,read_products,write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps. Names [U]; wire in W5–6.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/data_request"
  # compliance_topics = ["customers/data_request"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/redact"
  # compliance_topics = ["customers/redact"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/shop/redact"
  # compliance_topics = ["shop/redact"]

# App-owned product metafield for per-product lead time (shipping business days).
# https://shopify.dev/docs/apps/build/custom-data/ownership
[product.metafields.app.lead_time_days]
type = "number_integer"
name = "出荷リードタイム（営業日）"
description = "この商品の出荷準備に必要な営業日数。未設定は 0。"
access.admin = "merchant_read_write"
access.storefront = "public_read"

# settings_v1 is the single app-data JSON metafield on the AppInstallation
# (namespace "delivery", key "settings_v1"). The theme extension reads
# app.metafields.delivery.settings_v1. App-data metafields cannot be declared
# here, and the value is not mirrored onto the shop.
